name: Desktop Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-lint:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Lint backend
        run: npm --workspace backend run lint

  frontend-lint:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Lint frontend
        run: npm --workspace frontend run lint

  backend-build:
    runs-on: windows-latest

    needs:
      - backend-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: npm --workspace backend run build

  frontend-build:
    runs-on: windows-latest

    needs:
      - frontend-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm --workspace frontend run build

  build-desktop-installer:
    runs-on: windows-latest

    needs:
      - backend-build
      - frontend-build

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build and package desktop app
        run: npm run desktop:package

      - name: Find installer package
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path desktop/installer -File | Where-Object { $_.Name -match '\.(exe|msi)$' } | Select-Object -First 1
          if (-not $installer) {
            throw 'No installer package was produced in desktop/installer.'
          }
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: desktop-latest
          name: K8s Explorer Desktop Latest
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.installer.outputs.path }}