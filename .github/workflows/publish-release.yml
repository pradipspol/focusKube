name: Publish Release

on:
  push:
    branches:
      - release/*
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Lint backend
        run: npm --workspace backend run lint

      - name: Lint frontend
        run: npm --workspace frontend run lint

      - name: Build backend
        run: npm --workspace backend run build

      - name: Build frontend
        run: npm --workspace frontend run build

  build-installer:
    runs-on: ${{ matrix.os }}

    needs:
      - lint-and-build

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
          - os: macos-latest
            artifact: macos-installer
          - os: ubuntu-latest
            artifact: linux-installer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build and package desktop app
        run: npm run desktop:package

      - name: Collect installer artifacts
        shell: bash
        run: |
          set -e
          mkdir -p release-artifacts
          find desktop/installer -maxdepth 1 -type f \( -name '*.msi' -o -name '*.exe' \) -exec cp {} release-artifacts/ \; 2>/dev/null || true
          find desktop/dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release-artifacts/ \; 2>/dev/null || true
          echo "Collected artifacts:"
          ls -la release-artifacts

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest

    needs:
      - build-installer

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Read desktop package version
        id: version
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FocusKube v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
          files: release-artifacts/**/*
