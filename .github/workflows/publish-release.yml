name: Publish Release

on:
  push:
    branches:
      - release/*
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Lint backend
        run: npm --workspace backend run lint

      - name: Lint frontend
        run: npm --workspace frontend run lint

      - name: Build backend
        run: npm --workspace backend run build

      - name: Build frontend
        run: npm --workspace frontend run build


  build-and-release-installer:
    runs-on: windows-latest

    needs:
      - lint-and-build

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build and package desktop app
        run: npm run desktop:package

      - name: Find installer package
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path desktop/installer -File | Where-Object { $_.Name -match '\.(msi)$' } | Select-Object -First 1
          $exeInstaller = Get-ChildItem -Path desktop/installer -File | Where-Object { $_.Name -match '\.(exe)$' } | Select-Object -First 1
          if (-not $installer) {
            throw 'No installer package was produced in desktop/installer.'
          }
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe_path=$($exeInstaller.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      
      - name: Read desktop package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: K8s Explorer v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.exe_path }}