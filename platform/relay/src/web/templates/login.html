<h1>Sign in</h1>
<p class="sub">Sign in to FocusKube to continue.</p>
<div id="err"></div>
<form id="f">
  <label>Email <input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
  <label>Password
    <div class="pw-field">
      <input type="password" name="password" required autocomplete="current-password" placeholder="At least 8 characters">
      <button type="button" class="pw-toggle" aria-label="Show password" title="Show password">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </label>
  <button type="submit">Sign in</button>
</form>
<form id="tfa-form" style="display:none">
  <p class="sub" id="tfa-sent-to"></p>
  <label>Code <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autocomplete="one-time-code"></label>
  <button type="submit">Verify</button>
</form>
<div id="google-signin">
  <div class="auth-divider">or</div>
  <button type="button" id="google-start" class="secondary">Continue with Google</button>
  <div class="links" id="signup-link"><a href="/signup">Need an account? Sign up</a> &middot; <a href="/forgot-password">Forgot password?</a> &middot; <a href="/otp">Sign in with a code</a></div>
</div>
<script>
  const EYE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a20.6 20.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
  let tfaEmail = '';
  document.querySelectorAll('.pw-toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = btn.previousElementSibling;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
      btn.title = btn.ariaLabel = showing ? 'Show password' : 'Hide password';
    });
  });

  // Same-origin-relative only (mirrors the server-side check in auth/routes.ts's
  // validatedNextPath) — carries a page like the team-invite accept flow through login.
  const params = new URLSearchParams(location.search);
  const next = params.get('next');
  const validNext = next && next.startsWith('/') && !next.startsWith('//') ? next : null;
  document.getElementById('google-start').addEventListener('click', () => {
    const url = new URL('/v1/auth/google/start', location.origin);
    if (validNext) url.searchParams.set('next', validNext);
    location.assign(url);
  });
  if (validNext) {
    document.getElementById('signup-link').innerHTML =
      '<a href="/signup?next=' + encodeURIComponent(validNext) + '">Need an account? Sign up</a> &middot; <a href="/forgot-password">Forgot password?</a> &middot; <a href="/otp?next=' + encodeURIComponent(validNext) + '">Sign in with a code</a>';
  }

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('err').innerHTML = '';
    const body = Object.fromEntries(new FormData(e.target));
    const res = await fetch('/v1/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { document.getElementById('err').innerHTML = '<div class="error">' + esc(data.error) + '</div>'; return; }
    if (data.twoFactorRequired) {
      tfaEmail = data.email;
      e.target.style.display = 'none';
      document.getElementById('google-signin').style.display = 'none';
      document.getElementById('tfa-form').style.display = 'grid';
      document.getElementById('tfa-sent-to').textContent = 'Enter the code we emailed to ' + tfaEmail;
      return;
    }
    location.href = validNext || '/home';
  });

  document.getElementById('tfa-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('err').innerHTML = '';
    const data = Object.fromEntries(new FormData(e.target));
    const res = await fetch('/v1/auth/2fa/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: tfaEmail, code: data.code }) });
    const body = await res.json();
    if (!res.ok) { document.getElementById('err').innerHTML = '<div class="error">' + esc(body.error) + '</div>'; return; }
    location.href = validNext || '/home';
  });
</script>
