<h1>Set a new password</h1>
<div id="err"></div>
<form id="f">
  <label>New password
    <div class="pw-field">
      <input type="password" name="password" minlength="8" required autocomplete="new-password">
      <button type="button" class="pw-toggle" aria-label="Show password" title="Show password">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </label>
  <button type="submit">Reset password</button>
</form>
<script>
  const EYE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a20.6 20.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
  document.querySelector('.pw-toggle').addEventListener('click', (event) => {
    const button = event.currentTarget;
    const input = button.previousElementSibling;
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    button.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
    button.title = button.ariaLabel = showing ? 'Show password' : 'Hide password';
  });
  const resetToken = new URLSearchParams(location.search).get('token') || '';
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    body.token = resetToken;
    const res = await fetch('/v1/auth/password/reset-confirm', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { document.getElementById('err').innerHTML = '<div class="error">' + esc(data.error) + '</div>'; return; }
    location.href = '/login';
  });
</script>
