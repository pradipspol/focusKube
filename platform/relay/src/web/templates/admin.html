<main class="admin-dashboard">
  <header class="admin-header">
    <div class="admin-eyebrow"><span class="admin-live-dot"></span> FocusKube / Administration</div>
    <h1>Workspace overview</h1>
    <p class="sub">Account growth, verification, and subscription activity at a glance.</p>
  </header>
  <div id="admin-error" role="status"></div>
  <section class="admin-section" aria-labelledby="admin-overview-title">
    <div class="admin-section-heading">
      <div><span class="admin-index">OPERATIONS</span><h2 id="admin-overview-title">Account metrics</h2></div>
      <span class="admin-updated" id="admin-updated">Live metrics</span>
    </div>
    <div class="admin-metrics" id="admin-metrics" aria-live="polite"><p class="sub">Loading metrics&hellip;</p></div>
  </section>
</main>
<style>
  .admin-dashboard { display: grid; gap: 32px; padding-bottom: 24px; }
  .admin-header { padding: 20px 24px; border-left: 3px solid var(--accent); background: linear-gradient(100deg, var(--notice-bg), transparent 72%); }
  .admin-eyebrow, .admin-index { display: block; color: var(--accent-bright); font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .admin-eyebrow { display: flex; align-items: center; gap: 8px; }
  .admin-live-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ac26b; box-shadow: 0 0 0 3px rgba(74,194,107,0.14); }
  .admin-header h1 { margin: 12px 0 6px; color: var(--text-heading); font-size: 28px; line-height: 1.2; }
  .admin-header p { max-width: 68ch; margin: 0; line-height: 1.5; }
  .admin-section { min-width: 0; }
  .admin-section-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .admin-section-heading h2, .admin-invite h2 { margin: 5px 0 0; color: var(--text-heading); font-size: 19px; line-height: 1.3; }
  .admin-updated { color: var(--text-muted); font-size: 12px; }
  .admin-metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .admin-metric { min-width: 0; min-height: 88px; padding: 13px 14px; border: 1px solid var(--border); border-top: 2px solid var(--accent); border-radius: var(--radius-lg); background: var(--bg-elev); }
  .admin-metric:nth-child(5n + 2) { border-top-color: #43b581; }
  .admin-metric:nth-child(5n + 3) { border-top-color: #e2aa52; }
  .admin-metric:nth-child(5n + 4) { border-top-color: #df7782; }
  .admin-metric:nth-child(5n) { border-top-color: #8fa0b3; }
  .admin-metric-label { display: block; min-height: 30px; color: var(--text-muted); font-size: 12px; line-height: 1.35; }
  .admin-metric-value { display: block; margin-top: 6px; color: var(--text-heading); font-size: 23px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  @media (max-width: 1000px) { .admin-metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 700px) {
    .admin-layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .admin-sidebar { position: static; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; min-height: 0; padding: 10px 0; border-right: 0; border-bottom: 1px solid var(--border); }
    .admin-sidebar-label { display: none; }
    .admin-sidebar nav { display: flex; flex-wrap: wrap; gap: 2px; }
    .admin-sidebar nav a { padding: 8px; font-size: 12px; }
    .admin-back-link { margin: 0; padding: 8px 0 8px 8px; border-top: 0; border-left: 1px solid var(--border); white-space: nowrap; }
    .admin-main { padding: 20px 0 44px; }
    .admin-dashboard { gap: 26px; }
    .admin-header { padding: 18px; }
    .admin-header h1 { font-size: 24px; }
    .admin-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .admin-metric { min-height: 82px; padding: 11px; }
    .admin-metric-value { font-size: 21px; }
  }
</style>
<script>
  const metricDefinitions = [
    ['totalUsers', 'Active users'],
    ['newUsersLast30Days', 'Joined in 30 days'],
    ['verifiedUsers', 'Verified email'],
    ['activeTrials', 'Active trials'],
    ['activeSubscriptions', 'Paid plans'],
    ['organizations', 'Teams'],
    ['pendingInvites', 'Pending team invites'],
  ];
  const errorEl = document.getElementById('admin-error');
  const formatNumber = (value) => Number(value || 0).toLocaleString();

  async function loadOverview() {
    const response = await fetch('/v1/admin/overview');
    if (!response.ok) throw new Error('Could not load admin metrics.');
    const overview = await response.json();
    document.getElementById('admin-metrics').innerHTML = metricDefinitions.map(([key, label]) =>
      '<div class="admin-metric"><span class="admin-metric-label">' + label + '</span><strong class="admin-metric-value">' + formatNumber(overview[key]) + '</strong></div>'
    ).join('');
    document.getElementById('admin-updated').textContent = 'Updated ' + new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  loadOverview().catch((error) => {
    errorEl.innerHTML = '<div class="error">' + esc(error.message || 'Admin data could not be loaded.') + '</div>';
  });
</script>
